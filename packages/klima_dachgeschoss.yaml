#    duration: "00:15:00"
  klima_daikin_heizboost: # ha_daikin_heiz_boost
    name: Klima Daikin Heiz-Boost
    duration: "00:30:00"

sensor:
  - platform: statistics
    name: Klima Außentemperatur 24h Mittel 
    unique_id: klima_aussentemperatur_24h_mittel # ha_aussentemperatur_24h_mittel
    entity_id: sensor.replace_me_wetter_aussentemperatur
    state_characteristic: mean
    max_age:
      hours: 24

template:
  - binary_sensor:
      - name: Klima Urlaub aktiv
        unique_id: klima_urlaub_aktiv
        state: >-
          {% set start = as_timestamp(states('input_datetime.klima_urlaub_start'), default=none) %}
          {% set ende = as_timestamp(states('input_datetime.klima_urlaub_ende'), default=none) %}
          {{ is_state('input_boolean.klima_urlaub_aktiv', 'on')
             and start is not none and ende is not none
             and start <= as_timestamp(now()) <= ende }}
        icon: mdi:airplane
    sensor:
      - name: Klima Windgeschwindigkeit
        unique_id: klima_windgeschwindigkeit
        state: "{{ state_attr('weather.replace_me_home', 'wind_speed') }}"



